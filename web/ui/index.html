<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ORC Admin</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #161a22;
        --panel-2: #1c2230;
        --border: #232a39;
        --text: #e6e9ef;
        --muted: #8a93a6;
        --link: #6aa9ff;
        --accent: #6aa9ff;
        --ok: #3ddc97;
        --warn: #f5a524;
        --err: #ff6b6b;
        --info: #6aa9ff;
        --neutral: #8a93a6;
        --shadow:
          0 1px 0 rgba(255, 255, 255, 0.04), 0 8px 24px rgba(0, 0, 0, 0.3);
        --radius: 8px;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7fb;
          --panel: #ffffff;
          --panel-2: #f1f3f9;
          --border: #e3e7ef;
          --text: #1a2030;
          --muted: #5c6577;
          --link: #2563eb;
          --accent: #2563eb;
          --shadow:
            0 1px 0 rgba(0, 0, 0, 0.02), 0 8px 24px rgba(20, 30, 60, 0.08);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.45 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
      }
      a {
        color: var(--link);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      button {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }
      button.danger {
        background: transparent;
        border-color: var(--err);
        color: var(--err);
      }
      button.warn {
        background: transparent;
        border-color: var(--warn);
        color: var(--warn);
      }
      button.ok {
        background: transparent;
        border-color: var(--ok);
        color: var(--ok);
      }
      input,
      select {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 13px;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--accent);
      }

      header.topbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 18px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.2px;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 0 3px rgba(61, 220, 151, 0.18);
      }
      .brand .dot.bad {
        background: var(--err);
        box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.2);
      }
      nav.tabs {
        display: flex;
        gap: 4px;
        margin-left: 8px;
      }
      nav.tabs a {
        padding: 6px 12px;
        border-radius: 6px;
        color: var(--muted);
        font-weight: 500;
      }
      nav.tabs a.active {
        background: var(--panel-2);
        color: var(--text);
      }
      .topbar .spacer {
        flex: 1;
      }
      .topbar .meta {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 12px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .topbar .meta .pill {
        padding: 2px 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel-2);
      }

      main {
        padding: 16px;
        max-width: 1400px;
        margin: 0 auto;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 14px 16px;
        margin-bottom: 16px;
      }
      .panel h2 {
        margin: 0 0 10px 0;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--muted);
        font-weight: 600;
      }
      .panel h3 {
        margin: 0 0 8px 0;
        font-size: 14px;
        color: var(--text);
      }

      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      .toolbar label {
        color: var(--muted);
        font-size: 12px;
        display: flex;
        gap: 6px;
        align-items: center;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      table th,
      table td {
        padding: 8px 10px;
        text-align: left;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      table th {
        color: var(--muted);
        font-weight: 600;
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.6px;
        background: var(--panel-2);
        position: sticky;
        top: 0;
      }
      table tr.row {
        cursor: pointer;
      }
      table tr.row:hover td {
        background: var(--panel-2);
      }
      .mono {
        font-family: var(--mono);
        font-size: 12px;
      }
      .muted {
        color: var(--muted);
      }
      .nowrap {
        white-space: nowrap;
      }
      .wrap {
        white-space: pre-wrap;
        word-break: break-word;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 8px;
        border-radius: 999px;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.4px;
        border: 1px solid transparent;
      }
      .badge.PENDING {
        color: var(--info);
        background: rgba(106, 169, 255, 0.12);
        border-color: rgba(106, 169, 255, 0.35);
      }
      .badge.ENQUEUED {
        color: var(--warn);
        background: rgba(245, 165, 36, 0.12);
        border-color: rgba(245, 165, 36, 0.35);
      }
      .badge.DELAYED {
        color: var(--warn);
        background: rgba(245, 165, 36, 0.1);
        border-color: rgba(245, 165, 36, 0.3);
      }
      .badge.SUCCESS {
        color: var(--ok);
        background: rgba(61, 220, 151, 0.12);
        border-color: rgba(61, 220, 151, 0.35);
      }
      .badge.ERROR {
        color: var(--err);
        background: rgba(255, 107, 107, 0.12);
        border-color: rgba(255, 107, 107, 0.35);
      }
      .badge.CANCELLED {
        color: var(--muted);
        background: rgba(138, 147, 166, 0.12);
        border-color: rgba(138, 147, 166, 0.35);
      }
      .badge.MAX_RECOVERY_ATTEMPTS_EXCEEDED {
        color: var(--err);
        background: rgba(255, 107, 107, 0.12);
        border-color: rgba(255, 107, 107, 0.35);
      }

      .spinner {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 2px solid rgba(106, 169, 255, 0.25);
        border-top-color: var(--info);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        vertical-align: -2px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .grid-3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      @media (max-width: 900px) {
        .grid-2,
        .grid-3 {
          grid-template-columns: 1fr;
        }
      }

      dl.kv {
        margin: 0;
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 6px 14px;
        font-size: 13px;
      }
      dl.kv dt {
        color: var(--muted);
      }
      dl.kv dd {
        margin: 0;
        word-break: break-word;
      }

      pre.code {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        overflow-wrap: anywhere;
        max-height: 320px;
      }
      pre.error {
        background: rgba(255, 107, 107, 0.08);
        border-color: rgba(255, 107, 107, 0.35);
        color: var(--err);
      }

      .result-card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
        max-width: 100%;
      }
      .result-card__bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.7px;
      }
      .result-card__meta {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        min-width: 0;
      }
      .result-card__title {
        font-weight: 700;
        color: var(--text);
      }
      .result-card__stats {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        text-transform: none;
        letter-spacing: 0;
      }
      .result-card__copy {
        position: absolute;
        top: 6px;
        right: 6px;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0;
        width: 28px;
        height: 28px;
        padding: 0;
        border-radius: 999px;
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03);
        flex: 0 0 auto;
      }
      .result-card__copy:hover {
        color: var(--text);
        border-color: var(--accent);
        background: rgba(106, 169, 255, 0.08);
      }
      .result-card__copy svg {
        width: 14px;
        height: 14px;
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
      }
      .result-card__code {
        margin: 0;
        max-height: 220px;
        overflow: auto;
      }
      .result-card--error .result-card__code {
        background: rgba(255, 107, 107, 0.08);
        border-color: rgba(255, 107, 107, 0.35);
        color: var(--err);
      }

      .result-card__code-wrap {
        position: relative;
        min-width: 0;
        cursor: pointer;
      }

      .result-card__code-wrap:hover .result-card__copy {
        color: var(--text);
        border-color: var(--accent);
        background: rgba(106, 169, 255, 0.08);
      }

      .result-card__code-body {
        margin: 0;
        max-height: 220px;
        overflow: auto;
        padding-right: 2.25rem;
      }

      .result-card__code-body[data-collapsed-max-height] {
        max-height: var(--collapsed-max-height, 220px);
      }

      .result-card--expanded .result-card__code-body {
        max-height: min(60vh, 520px);
      }

      .result-card__toggle {
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 11px;
        line-height: 1.2;
      }

      .steps-main-row td {
        border-bottom: none;
      }

      .steps-result-row td {
        padding-top: 0;
      }

      .steps-result-row .result-card {
        width: 100%;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      table.steps-table td {
        vertical-align: top;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .toast {
        position: fixed;
        bottom: 16px;
        right: 16px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        padding: 10px 14px;
        border-radius: 6px;
        box-shadow: var(--shadow);
        max-width: 360px;
        font-size: 13px;
        animation: slideIn 0.15s ease-out;
        z-index: 100;
      }
      .toast.err {
        border-left-color: var(--err);
      }
      .toast.ok {
        border-left-color: var(--ok);
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .empty {
        padding: 24px;
        text-align: center;
        color: var(--muted);
      }

      .stats {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .stat {
        flex: 1 1 140px;
        padding: 12px 14px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        min-width: 120px;
      }
      .stat .label {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        line-height: 1.25;
        overflow-wrap: anywhere;
        min-height: 2.5em; /* keep cards aligned when some labels wrap to 2 lines */
      }
      .stat .value {
        font-size: 20px;
        font-weight: 700;
        margin-top: 4px;
      }

      .tree {
        font-family: var(--mono);
        font-size: 12px;
      }
      .tree ul {
        list-style: none;
        padding-left: 18px;
        margin: 0;
        border-left: 1px dashed var(--border);
      }
      .tree li {
        padding: 2px 0;
      }

      /* small-screen tweaks */
      @media (max-width: 700px) {
        header.topbar {
          flex-wrap: wrap;
          gap: 10px;
          padding: 10px 12px;
        }
        .topbar .meta {
          width: 100%;
        }
        main {
          padding: 10px;
        }
        dl.kv {
          grid-template-columns: 100px 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span id="health-dot" class="dot" title="health"></span>
        <span id="brand-name">ORC Admin</span>
      </div>
      <nav class="tabs">
        <a id="tab-workflows" href="#/workflows">Workflows</a>
        <a id="tab-queues" href="#/queues">Queues</a>
        <a id="tab-info" href="#/info">Info</a>
      </nav>
      <div class="spacer"></div>
      <div class="meta">
        <span class="pill" id="api-base-pill" title="Admin API base path"
          >api: …</span
        >
        <span class="pill" id="executor-pill" title="Executor ID"
          >executor: …</span
        >
        <label class="pill" style="cursor: pointer; user-select: none">
          <input
            type="checkbox"
            id="auto-refresh"
            checked
            style="margin: 0 6px 0 0; vertical-align: -2px"
          />
          auto-refresh
        </label>
      </div>
    </header>

    <main id="view"></main>

    <script>
      (function () {
        // ---------------------------------------------------------------------
        // Config & helpers
        // ---------------------------------------------------------------------
        // The Go handler replaces __API_BASE__ with the actual admin path. It
        // can also be overridden at runtime via ?api=/some/path (handy when the
        // UI is opened from a different origin).
        let API_BASE = "__API_BASE__";
        const qsApi = new URLSearchParams(location.search).get("api");
        if (qsApi) API_BASE = qsApi;
        if (!API_BASE || API_BASE === "__API_BASE__") API_BASE = "/admin";
        document.getElementById("api-base-pill").textContent =
          "api: " + API_BASE;

        const POLL_MS = 2000;
        let pollTimer = null;
        let currentRoute = null;
        const auto = document.getElementById("auto-refresh");

        function $(sel, el) {
          return (el || document).querySelector(sel);
        }
        function el(tag, attrs, children) {
          const node = document.createElement(tag);
          if (attrs) {
            for (const [k, v] of Object.entries(attrs)) {
              if (v == null || v === false) continue;
              if (k === "class") node.className = v;
              else if (k === "html") node.innerHTML = v;
              else if (k.startsWith("on") && typeof v === "function") {
                node.addEventListener(k.slice(2).toLowerCase(), v);
              } else if (k === "style" && typeof v === "object") {
                Object.assign(node.style, v);
              } else {
                node.setAttribute(k, v);
              }
            }
          }
          if (children == null) return node;
          if (!Array.isArray(children)) children = [children];
          for (const c of children) {
            if (c == null || c === false) continue;
            node.appendChild(
              typeof c === "string" || typeof c === "number"
                ? document.createTextNode(String(c))
                : c,
            );
          }
          return node;
        }
        function escapeHTML(s) {
          if (s == null) return "";
          return String(s)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");
        }

        function api(path, opts) {
          return fetch(API_BASE + path, opts).then(async (r) => {
            const text = await r.text();
            let data = null;
            try {
              data = text ? JSON.parse(text) : null;
            } catch {}
            if (!r.ok) {
              const msg =
                (data && (data.error || data.message)) ||
                r.statusText ||
                "HTTP " + r.status;
              const err = new Error(msg);
              err.status = r.status;
              throw err;
            }
            return data;
          });
        }

        function toast(msg, kind) {
          const t = el("div", { class: "toast " + (kind || "") }, msg);
          document.body.appendChild(t);
          setTimeout(() => t.remove(), 3500);
        }

        // Live "human" duration that updates every second when called as a
        // function via DOM. We render the durations server-side too (DurationHuman),
        // but for running rows we want them to *tick*.
        function humanizeMs(ms) {
          if (!ms || ms < 0) return "0s";
          const s = Math.floor(ms / 1000);
          if (s < 1) return ms + "ms";
          if (s < 60) return s + "s";
          const m = Math.floor(s / 60);
          const rs = s % 60;
          if (m < 60) return m + "m" + rs + "s";
          const h = Math.floor(m / 60);
          const rm = m % 60;
          if (h < 24) return h + "h" + rm + "m" + rs + "s";
          const d = Math.floor(h / 24);
          const rh = h % 24;
          return d + "d" + rh + "h";
        }

        function statusBadge(status, isRunning) {
          const span = el("span", { class: "badge " + status });
          if (isRunning || status === "PENDING") {
            span.appendChild(el("span", { class: "spinner" }));
          }
          span.appendChild(document.createTextNode(status));
          return span;
        }

        // tickClocks updates any element with [data-started-at] to display the
        // live duration since that timestamp, on a 1s tick. We intentionally use
        // a single shared interval so the table doesn't blow up.
        let tickIv = null;
        function startTicking() {
          if (tickIv) return;
          tickIv = setInterval(() => {
            const nodes = document.querySelectorAll("[data-started-at]");
            const now = Date.now();
            nodes.forEach((n) => {
              const t = parseInt(n.getAttribute("data-started-at"), 10);
              if (!t) return;
              n.textContent = humanizeMs(now - t);
            });
          }, 1000);
        }

        // ---------------------------------------------------------------------
        // Router
        // ---------------------------------------------------------------------
        function parseRoute() {
          let h = (location.hash || "").replace(/^#\/?/, "");
          const parts = h.split("/").filter(Boolean);
          if (parts.length === 0 || parts[0] === "workflows") {
            if (parts[1])
              return { name: "workflow", id: decodeURIComponent(parts[1]) };
            return { name: "workflows" };
          }
          if (parts[0] === "queues") return { name: "queues" };
          if (parts[0] === "info") return { name: "info" };
          return { name: "workflows" };
        }

        function highlightTab(route) {
          for (const id of ["tab-workflows", "tab-queues", "tab-info"]) {
            document.getElementById(id).classList.remove("active");
          }
          if (route.name === "workflows" || route.name === "workflow") {
            document.getElementById("tab-workflows").classList.add("active");
          } else if (route.name === "queues") {
            document.getElementById("tab-queues").classList.add("active");
          } else if (route.name === "info") {
            document.getElementById("tab-info").classList.add("active");
          }
        }

        function render() {
          const route = parseRoute();
          currentRoute = route;
          highlightTab(route);

          if (pollTimer) {
            clearInterval(pollTimer);
            pollTimer = null;
          }
          const view = document.getElementById("view");

          if (route.name === "workflows") return renderWorkflowsList(view);
          if (route.name === "workflow")
            return renderWorkflowDetail(view, route.id);
          if (route.name === "queues") return renderQueues(view);
          if (route.name === "info") return renderInfo(view);
        }

        // ---------------------------------------------------------------------
        // Top bar / health refresh
        // ---------------------------------------------------------------------
        let infoCache = null;
        async function refreshInfo() {
          try {
            const info = await api("/info");
            infoCache = info;
            document.getElementById("brand-name").textContent =
              info.app_name || "ORC Admin";
            document.getElementById("executor-pill").textContent =
              "executor: " + (info.executor_id || "—");
            document.getElementById("health-dot").classList.remove("bad");
            return info;
          } catch (e) {
            document.getElementById("health-dot").classList.add("bad");
            throw e;
          }
        }

        // ---------------------------------------------------------------------
        // Workflows list
        // ---------------------------------------------------------------------
        const STATUSES = [
          "PENDING",
          "ENQUEUED",
          "DELAYED",
          "SUCCESS",
          "ERROR",
          "CANCELLED",
          "MAX_RECOVERY_ATTEMPTS_EXCEEDED",
        ];

        const PAGE_SIZE_OPTIONS = [25, 50, 100, 200, 500];

        // Filter UI state lives in the URL so reloads / back-forward keep it.
        // `page` is 1-based and is preserved across refresh; any change to the
        // filter shape (status / name / queue / limit) resets it back to 1.
        function listFilters() {
          const u = new URL(location.href);
          const rawLimit = parseInt(u.searchParams.get("limit") || "100", 10);
          const limit =
            Number.isFinite(rawLimit) && rawLimit > 0 ? rawLimit : 100;
          const rawPage = parseInt(u.searchParams.get("page") || "1", 10);
          const page = Number.isFinite(rawPage) && rawPage > 0 ? rawPage : 1;
          return {
            status: u.searchParams.getAll("status"),
            name: u.searchParams.get("name") || "",
            queue: u.searchParams.get("queue") || "",
            limit: String(limit),
            page,
          };
        }
        function setListFilter(name, value, multi) {
          const u = new URL(location.href);
          if (multi) {
            u.searchParams.delete(name);
            for (const v of value) u.searchParams.append(name, v);
          } else {
            if (value) u.searchParams.set(name, value);
            else u.searchParams.delete(name);
          }
          // Any filter change drops us back to page 1.
          if (name !== "page") u.searchParams.delete("page");
          history.replaceState(null, "", u.toString());
        }
        function setListPage(p) {
          const u = new URL(location.href);
          if (!p || p <= 1) u.searchParams.delete("page");
          else u.searchParams.set("page", String(p));
          history.replaceState(null, "", u.toString());
        }

        function buildListQuery(f) {
          const p = new URLSearchParams();
          for (const s of f.status) p.append("status", s);
          if (f.name) p.set("name", f.name);
          if (f.queue) p.set("queue", f.queue);
          p.set("limit", f.limit || "100");
          p.set("page", String(f.page || 1));
          p.set("desc", "1");
          p.set("load_io", "0");
          return p.toString();
        }

        async function renderWorkflowsList(view) {
          view.innerHTML = "";
          const filters = listFilters();

          // Stats panel
          const stats = el("div", { class: "panel" }, [
            el("h2", null, "Status"),
            el(
              "div",
              { id: "stats-row", class: "stats" },
              el("div", { class: "muted" }, "Loading…"),
            ),
          ]);
          view.appendChild(stats);

          // Filters
          const queueOptions = el("select", { id: "f-queue" }, [
            el("option", { value: "" }, "any queue"),
          ]);
          const statusBox = el("div", {
            id: "f-status",
            style: { display: "flex", gap: "8px", flexWrap: "wrap" },
          });
          for (const s of STATUSES) {
            const id = "fs-" + s;
            const cb = el("input", {
              type: "checkbox",
              id,
              value: s,
              checked: filters.status.includes(s),
              onchange: () => {
                const all = Array.from(
                  document.querySelectorAll("#f-status input:checked"),
                ).map((x) => x.value);
                setListFilter("status", all, true);
                refresh();
              },
            });
            const lab = el(
              "label",
              { for: id, style: { color: "var(--muted)", fontSize: "12px" } },
              [cb, document.createTextNode(" "), s],
            );
            statusBox.appendChild(lab);
          }

          const nameInput = el("input", {
            id: "f-name",
            placeholder: "name contains…",
            value: filters.name,
            oninput: debounce(() => {
              setListFilter("name", document.getElementById("f-name").value);
              refresh();
            }, 250),
          });

          const limitSelect = el("select", {
            id: "f-limit",
            onchange: () => {
              setListFilter("limit", document.getElementById("f-limit").value);
              refresh();
            },
          });
          for (const n of PAGE_SIZE_OPTIONS) {
            const o = el("option", { value: String(n) }, String(n) + " / page");
            if (String(n) === filters.limit) o.selected = true;
            limitSelect.appendChild(o);
          }
          // If the URL carries a non-standard limit (e.g. carried over from
          // an older link), surface it in the dropdown so the user sees what's
          // actually being requested.
          if (!PAGE_SIZE_OPTIONS.map(String).includes(filters.limit)) {
            const o = el(
              "option",
              { value: filters.limit, selected: true },
              filters.limit + " / page",
            );
            limitSelect.appendChild(o);
          }

          const filterPanel = el("div", { class: "panel" }, [
            el("div", { class: "toolbar" }, [
              el("strong", null, "Filters"),
              nameInput,
              queueOptions,
              limitSelect,
              el("button", { onclick: refresh }, "Refresh"),
              el("span", { class: "spacer", style: { flex: "1" } }),
              el("span", { class: "muted mono", id: "list-count" }, ""),
            ]),
            statusBox,
          ]);
          view.appendChild(filterPanel);

          // Table
          const tableWrap = el("div", {
            class: "panel",
            style: { padding: "0", overflow: "auto" },
          });
          tableWrap.innerHTML = `
      <table>
        <thead><tr>
          <th>Workflow ID</th>
          <th>Name</th>
          <th>Status</th>
          <th>Queue</th>
          <th class="nowrap">Attempts</th>
          <th class="nowrap" title="Wall-clock time the workflow ran. Frozen once the workflow reaches a terminal state.">Duration</th>
          <th class="nowrap" title="How long ago the workflow was created.">Created</th>
          <th>Updated</th>
        </tr></thead>
        <tbody id="list-body"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
      </table>
    `;
          view.appendChild(tableWrap);

          // Pagination panel
          const paginationPanel = el("div", {
            class: "panel",
            id: "pagination-panel",
            style: { display: "none" },
          });
          view.appendChild(paginationPanel);

          // GC panel (collapsed by default — destructive, but useful).
          view.appendChild(buildGCPanel(refresh));

          queueOptions.addEventListener("change", () => {
            setListFilter("queue", queueOptions.value);
            refresh();
          });

          async function refresh() {
            if (currentRoute !== route) return;
            const f = listFilters();
            try {
              const [info, list] = await Promise.all([
                refreshInfo(),
                api("/workflows?" + buildListQuery(f)),
              ]);
              renderStats(info);
              // Populate queue dropdown
              const qNames = (info.queues || []).map((q) => q.name);
              const cur = queueOptions.value;
              queueOptions.innerHTML = "";
              queueOptions.appendChild(
                el("option", { value: "" }, "any queue"),
              );
              for (const n of qNames) {
                const o = el("option", { value: n }, n);
                if (n === f.queue) o.selected = true;
                queueOptions.appendChild(o);
              }
              if (cur && !qNames.includes(cur)) queueOptions.value = "";

              renderListBody(list.items || []);
              renderPagination(list, f, refresh);
            } catch (e) {
              document.getElementById("list-body").innerHTML =
                `<tr><td colspan="8" class="empty" style="color:var(--err)">${escapeHTML(e.message)}</td></tr>`;
            }
          }

          const route = currentRoute;
          await refresh();
          if (auto.checked) pollTimer = setInterval(refresh, POLL_MS);
          startTicking();
        }

        // renderPagination updates the toolbar count text and the pagination
        // panel below the table. The backend always returns total/page/page_size,
        // so we have everything we need to compute "showing X–Y of Z".
        function renderPagination(list, f, refreshFn) {
          const total = list.total || 0;
          const pageSize = list.page_size || parseInt(f.limit, 10) || 100;
          const page = list.page || f.page || 1;
          const items = list.items || [];
          const lastPage =
            pageSize > 0 ? Math.max(1, Math.ceil(total / pageSize)) : 1;
          const start = items.length ? (page - 1) * pageSize + 1 : 0;
          const end = items.length ? start + items.length - 1 : 0;

          const countEl = document.getElementById("list-count");
          if (countEl) {
            countEl.textContent =
              total === 0 ? "0 results" : `showing ${start}–${end} of ${total}`;
          }

          // If the requested page is past the end (e.g. a row was deleted while we
          // were sitting on the last page, or the URL came in with page=99) jump
          // back to the last valid page and re-fetch.
          if (total > 0 && page > lastPage) {
            setListPage(lastPage);
            refreshFn();
            return;
          }

          const panel = document.getElementById("pagination-panel");
          if (!panel) return;

          // Hide the panel entirely when there's nothing to paginate through.
          if (total <= pageSize) {
            panel.style.display = "none";
            panel.innerHTML = "";
            return;
          }
          panel.style.display = "";
          panel.innerHTML = "";

          const goto = (p) => {
            const next = Math.min(Math.max(1, p), lastPage);
            if (next === page) return;
            setListPage(next);
            // Smooth-scroll back up so the user sees the new top of the table.
            window.scrollTo({ top: 0, behavior: "smooth" });
            refreshFn();
          };

          const bar = el("div", {
            class: "toolbar",
            style: { margin: "0", justifyContent: "space-between" },
          });

          const left = el(
            "div",
            { class: "muted mono", style: { fontSize: "12px" } },
            `Page ${page} of ${lastPage} · ${total} total · ${pageSize} per page`,
          );

          const right = el("div", {
            style: { display: "flex", gap: "6px", alignItems: "center" },
          });
          const first = el(
            "button",
            { disabled: page <= 1, onclick: () => goto(1) },
            "« First",
          );
          const prev = el(
            "button",
            { disabled: page <= 1, onclick: () => goto(page - 1) },
            "‹ Prev",
          );
          const next = el(
            "button",
            { disabled: page >= lastPage, onclick: () => goto(page + 1) },
            "Next ›",
          );
          const last = el(
            "button",
            { disabled: page >= lastPage, onclick: () => goto(lastPage) },
            "Last »",
          );

          const jumpInput = el("input", {
            type: "number",
            min: "1",
            max: String(lastPage),
            value: String(page),
            style: { width: "70px" },
            onkeydown: (e) => {
              if (e.key === "Enter") jump();
            },
          });
          const jumpBtn = el("button", { onclick: () => jump() }, "Go");
          function jump() {
            const v = parseInt(jumpInput.value, 10);
            if (!Number.isFinite(v) || v < 1) return;
            goto(v);
          }
          const jumpWrap = el(
            "div",
            {
              style: {
                display: "flex",
                gap: "4px",
                alignItems: "center",
                marginLeft: "8px",
              },
            },
            [
              el(
                "span",
                { class: "muted", style: { fontSize: "12px" } },
                "Go to:",
              ),
              jumpInput,
              jumpBtn,
            ],
          );

          right.append(first, prev, next, last, jumpWrap);
          bar.append(left, right);
          panel.appendChild(bar);
        }

        // ---------------------------------------------------------------------
        // Garbage collection
        // ---------------------------------------------------------------------
        // Terminal statuses are the only ones the backend will GC by default.
        // We expose AllowNonTerminal as a separate, distinctly-styled checkbox
        // because deleting a PENDING/ENQUEUED row can wipe a workflow that's
        // still actively running.
        const GC_TERMINAL_STATUSES = [
          "SUCCESS",
          "ERROR",
          "CANCELLED",
          "MAX_RECOVERY_ATTEMPTS_EXCEEDED",
        ];
        const GC_NONTERMINAL_STATUSES = ["PENDING", "ENQUEUED", "DELAYED"];

        // Local YYYY-MM-DDTHH:mm string for <input type="datetime-local">.
        function toLocalDatetimeInputValue(d) {
          const pad = (n) => String(n).padStart(2, "0");
          return (
            d.getFullYear() +
            "-" +
            pad(d.getMonth() + 1) +
            "-" +
            pad(d.getDate()) +
            "T" +
            pad(d.getHours()) +
            ":" +
            pad(d.getMinutes())
          );
        }

        function buildGCPanel(onAfterRun) {
          const wrap = el("details", { class: "panel", id: "gc-panel" });
          const summary = el(
            "summary",
            {
              style: {
                cursor: "pointer",
                listStyle: "disclosure-closed",
                color: "var(--muted)",
                fontSize: "12px",
                textTransform: "uppercase",
                letterSpacing: ".8px",
                fontWeight: "600",
              },
            },
            "Garbage collection",
          );
          wrap.appendChild(summary);

          const body = el("div", { style: { marginTop: "12px" } });
          body.appendChild(
            el(
              "div",
              {
                class: "muted",
                style: {
                  marginBottom: "12px",
                  fontSize: "12px",
                  lineHeight: "1.5",
                },
              },
              "Permanently delete workflows in the selected statuses whose " +
                "last update is strictly older than the cutoff. Cascades to " +
                "checkpointed steps, queued notifications, and event records. " +
                "There is no undo.",
            ),
          );

          // Statuses
          body.appendChild(
            el(
              "div",
              {
                class: "muted",
                style: {
                  fontSize: "11px",
                  textTransform: "uppercase",
                  letterSpacing: ".6px",
                  marginBottom: "6px",
                },
              },
              "Statuses",
            ),
          );
          const termRow = el("div", {
            style: {
              display: "flex",
              flexWrap: "wrap",
              gap: "10px",
              marginBottom: "10px",
            },
          });
          for (const s of GC_TERMINAL_STATUSES) {
            const id = "gc-st-" + s;
            const cb = el("input", {
              type: "checkbox",
              id,
              value: s,
              checked: s === "SUCCESS",
            });
            termRow.appendChild(
              el(
                "label",
                {
                  for: id,
                  style: {
                    display: "flex",
                    gap: "6px",
                    alignItems: "center",
                    fontSize: "12px",
                    color: "var(--text)",
                  },
                },
                [cb, document.createTextNode(s.replaceAll("_", " "))],
              ),
            );
          }
          body.appendChild(termRow);

          // Non-terminal statuses (gated behind a separate checkbox).
          const nonTermRow = el("div", {
            style: {
              display: "none",
              flexWrap: "wrap",
              gap: "10px",
              marginBottom: "10px",
            },
          });
          nonTermRow.id = "gc-nonterminal-row";
          for (const s of GC_NONTERMINAL_STATUSES) {
            const id = "gc-st-" + s;
            const cb = el("input", { type: "checkbox", id, value: s });
            nonTermRow.appendChild(
              el(
                "label",
                {
                  for: id,
                  style: {
                    display: "flex",
                    gap: "6px",
                    alignItems: "center",
                    fontSize: "12px",
                    color: "var(--warn)",
                  },
                },
                [cb, document.createTextNode(s.replaceAll("_", " "))],
              ),
            );
          }
          body.appendChild(nonTermRow);

          const allowNT = el("input", {
            type: "checkbox",
            id: "gc-allow-nonterminal",
            onchange: () => {
              const on = document.getElementById(
                "gc-allow-nonterminal",
              ).checked;
              document.getElementById("gc-nonterminal-row").style.display = on
                ? "flex"
                : "none";
              if (!on) {
                for (const s of GC_NONTERMINAL_STATUSES) {
                  const cb = document.getElementById("gc-st-" + s);
                  if (cb) cb.checked = false;
                }
              }
            },
          });
          body.appendChild(
            el(
              "label",
              {
                for: "gc-allow-nonterminal",
                style: {
                  display: "flex",
                  gap: "6px",
                  alignItems: "center",
                  fontSize: "12px",
                  color: "var(--warn)",
                  marginBottom: "14px",
                },
              },
              [
                allowNT,
                document.createTextNode(
                  "Also delete non-terminal workflows (dangerous — these may still be running)",
                ),
              ],
            ),
          );

          // Cutoff
          body.appendChild(
            el(
              "div",
              {
                class: "muted",
                style: {
                  fontSize: "11px",
                  textTransform: "uppercase",
                  letterSpacing: ".6px",
                  marginBottom: "6px",
                },
              },
              "Updated before",
            ),
          );

          const defaultCutoff = new Date(Date.now() - 24 * 60 * 60 * 1000); // 24h ago
          const cutoffInput = el("input", {
            type: "datetime-local",
            id: "gc-cutoff",
            value: toLocalDatetimeInputValue(defaultCutoff),
            style: { minWidth: "200px" },
          });
          const cutoffRow = el("div", {
            style: {
              display: "flex",
              flexWrap: "wrap",
              gap: "8px",
              alignItems: "center",
              marginBottom: "14px",
            },
          });
          cutoffRow.appendChild(cutoffInput);

          const presets = [
            { label: "1 second ago", ms: 1 * 1000 },
            { label: "5 minutes ago", ms: 5 * 60 * 1000 },
            { label: "15 minutes ago", ms: 15 * 60 * 1000 },
            { label: "1 hour ago", ms: 60 * 60 * 1000 },
            { label: "1 day ago", ms: 24 * 60 * 60 * 1000 },
            { label: "1 week ago", ms: 7 * 24 * 60 * 60 * 1000 },
            { label: "1 month ago", ms: 30 * 24 * 60 * 60 * 1000 },
          ];
          for (const p of presets) {
            cutoffRow.appendChild(
              el(
                "button",
                {
                  type: "button",
                  onclick: () => {
                    cutoffInput.value = toLocalDatetimeInputValue(
                      new Date(Date.now() - p.ms),
                    );
                  },
                },
                p.label,
              ),
            );
          }
          body.appendChild(cutoffRow);

          // Action row
          const result = el("div", {
            id: "gc-result",
            style: { fontSize: "13px" },
          });
          const runBtn = el(
            "button",
            {
              class: "danger",
              onclick: () => runGC(result, onAfterRun),
            },
            "Run garbage collection",
          );
          body.appendChild(
            el(
              "div",
              {
                style: {
                  display: "flex",
                  gap: "10px",
                  alignItems: "center",
                  flexWrap: "wrap",
                },
              },
              [runBtn, result],
            ),
          );

          wrap.appendChild(body);
          return wrap;
        }

        async function runGC(resultEl, onAfterRun) {
          const statuses = [];
          for (const s of [
            ...GC_TERMINAL_STATUSES,
            ...GC_NONTERMINAL_STATUSES,
          ]) {
            const cb = document.getElementById("gc-st-" + s);
            if (cb && cb.checked) statuses.push(s);
          }
          if (statuses.length === 0) {
            resultEl.innerHTML = `<span style="color:var(--err)">Pick at least one status to delete.</span>`;
            return;
          }
          const cutoffStr = document.getElementById("gc-cutoff").value;
          if (!cutoffStr) {
            resultEl.innerHTML = `<span style="color:var(--err)">Pick an "Updated before" cutoff.</span>`;
            return;
          }
          const cutoffDate = new Date(cutoffStr);
          if (isNaN(cutoffDate.getTime())) {
            resultEl.innerHTML = `<span style="color:var(--err)">Invalid cutoff timestamp.</span>`;
            return;
          }
          const allowNT = document.getElementById(
            "gc-allow-nonterminal",
          ).checked;

          const summary = `Permanently delete all workflows in [${statuses.join(", ")}] last updated before ${cutoffDate.toLocaleString()}.\n\nThis cannot be undone. Continue?`;
          if (!confirm(summary)) return;

          resultEl.innerHTML = `<span class="muted"><span class="spinner"></span> running…</span>`;
          try {
            const res = await api("/workflows/gc", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                statuses,
                updated_before: cutoffDate.toISOString(),
                allow_non_terminal: allowNT,
              }),
            });
            const deleted = res.deleted || 0;
            const failed = res.failed || 0;
            const errs = res.errors || [];
            let html = `<span style="color:var(--ok)">Deleted <strong>${deleted}</strong></span>`;
            if (failed > 0)
              html += ` &middot; <span style="color:var(--err)">Failed <strong>${failed}</strong></span>`;
            if (errs.length > 0)
              html += `<div class="muted" style="margin-top:6px;font-size:12px">${errs.map(escapeHTML).join("<br>")}</div>`;
            resultEl.innerHTML = html;
            toast(
              `GC complete: ${deleted} deleted` +
                (failed ? `, ${failed} failed` : ""),
              failed ? "err" : "ok",
            );
            if (typeof onAfterRun === "function") onAfterRun();
          } catch (e) {
            resultEl.innerHTML = `<span style="color:var(--err)">${escapeHTML(e.message)}</span>`;
            toast(e.message, "err");
          }
        }

        function renderStats(info) {
          const row = document.getElementById("stats-row");
          if (!row) return;
          const counts = info.status_counts || {};
          row.innerHTML = "";
          for (const s of STATUSES) {
            const v = counts[s] || 0;
            const card = el("div", { class: "stat", title: s }, [
              el("div", { class: "label" }, s.replaceAll("_", " ")),
              el("div", { class: "value" }, String(v)),
            ]);
            card.style.cursor = "pointer";
            card.addEventListener("click", () => {
              setListFilter("status", [s], true);
              // refresh checkboxes
              document.querySelectorAll("#f-status input").forEach((cb) => {
                cb.checked = cb.value === s;
              });
              // trigger render via hash (no change) — manually call refresh via re-render
              render();
            });
            row.appendChild(card);
          }
        }

        function renderListBody(items) {
          const body = document.getElementById("list-body");
          if (!items.length) {
            body.innerHTML = `<tr><td colspan="8" class="empty">No workflows match the current filters.</td></tr>`;
            return;
          }
          body.innerHTML = "";
          for (const w of items) {
            const tr = el("tr", {
              class: "row",
              onclick: () =>
                goto("/workflows/" + encodeURIComponent(w.workflow_id)),
            });

            const idCell = el("td", { class: "mono" }, w.workflow_id);
            const nameCell = el(
              "td",
              null,
              w.name || el("span", { class: "muted" }, "—"),
            );
            const statusCell = el(
              "td",
              null,
              statusBadge(w.status, w.is_running),
            );
            const queueCell = el(
              "td",
              { class: "mono muted" },
              w.queue_name || "—",
            );
            const attemptsCell = el(
              "td",
              { class: "nowrap" },
              attemptsCellContent(w),
            );

            const durCell = el("td", { class: "nowrap mono" });
            if (w.is_running && w.started_at) {
              const started = Date.parse(w.started_at);
              durCell.setAttribute("data-started-at", String(started));
              durCell.textContent = humanizeMs(Date.now() - started);
            } else {
              durCell.textContent = w.duration_human || "—";
            }

            const ageCell = el(
              "td",
              {
                class: "nowrap mono muted",
                title: w.created_at
                  ? new Date(w.created_at).toLocaleString()
                  : "",
              },
              w.age_human ? w.age_human + " ago" : "—",
            );
            const updCell = el(
              "td",
              { class: "nowrap muted mono" },
              formatTime(w.updated_at),
            );

            tr.append(
              idCell,
              nameCell,
              statusCell,
              queueCell,
              attemptsCell,
              durCell,
              ageCell,
              updCell,
            );
            body.appendChild(tr);
          }
        }

        function attemptsCellContent(w) {
          const a = w.attempts || 0;
          if (a <= 1 && !w.error)
            return el("span", { class: "muted mono" }, String(a));
          const span = el(
            "span",
            { class: "mono", title: w.error || "" },
            String(a),
          );
          if (a > 1 || w.error) {
            span.style.color = "var(--err)";
            span.appendChild(document.createTextNode(" "));
            span.appendChild(
              el(
                "span",
                { class: "muted", style: { fontSize: "11px" } },
                "errs",
              ),
            );
          }
          return span;
        }

        function formatTime(iso) {
          if (!iso) return "—";
          const t = new Date(iso);
          if (isNaN(t.getTime())) return "—";
          return t.toLocaleString();
        }

        function debounce(fn, ms) {
          let t = null;
          return function (...args) {
            clearTimeout(t);
            t = setTimeout(() => fn.apply(this, args), ms);
          };
        }

        function renderTree(node, rootId) {
          const root = document.getElementById("wf-tree");
          if (!root) return;
          root.innerHTML = "";
          const wrap = el("div", { class: "tree" });
          wrap.appendChild(treeNode(node, rootId));
          root.appendChild(wrap);
        }
        function treeNode(node, rootId) {
          const li = el("div");
          const isRoot = node.workflow_id === rootId;
          const link = isRoot
            ? el("span", { class: "mono" }, node.workflow_id)
            : el(
                "a",
                {
                  class: "mono",
                  href: "#/workflows/" + encodeURIComponent(node.workflow_id),
                },
                node.workflow_id,
              );
          li.appendChild(link);
          li.appendChild(document.createTextNode(" "));
          li.appendChild(statusBadge(node.status, node.is_running));
          if (node.name) {
            li.appendChild(document.createTextNode(" "));
            li.appendChild(el("span", { class: "muted" }, node.name));
          }
          if (node.children && node.children.length) {
            const ul = el("ul");
            for (const c of node.children) {
              const child = el("li");
              child.appendChild(treeNode(c, rootId));
              ul.appendChild(child);
            }
            li.appendChild(ul);
          }
          return li;
        }

        function prettyJSON(v) {
          try {
            return JSON.stringify(v, null, 2);
          } catch {
            return String(v);
          }
        }

        function formatBytes(bytes) {
          if (!Number.isFinite(bytes) || bytes < 0) return "0 B";
          if (bytes < 1024) return bytes + " B";
          const units = ["KB", "MB", "GB"];
          let value = bytes / 1024;
          let unit = units[0];
          for (let i = 1; i < units.length && value >= 1024; i++) {
            value /= 1024;
            unit = units[i];
          }
          return (
            (value >= 10 ? value.toFixed(0) : value.toFixed(1)) + " " + unit
          );
        }

        function summarizeStepResult(value) {
          const raw = typeof value === "string" ? value : prettyJSON(value);
          const lineCount = raw ? raw.split("\n").length : 0;
          const byteCount = new TextEncoder().encode(raw).length;
          let kind = typeof value;
          if (value === null) kind = "null";
          else if (Array.isArray(value)) kind = "array";
          else if (kind === "object") kind = "json";
          else if (kind === "string") kind = /\s/.test(raw) ? "text" : "value";
          return {
            kind: kind.toUpperCase(),
            raw,
            stats: `${lineCount || 1} line${lineCount === 1 ? "" : "s"} · ${formatBytes(byteCount)}`,
          };
        }

        function renderStepResult(value, isError, opts) {
          const options = opts || {};
          const summary = summarizeStepResult(value);
          const card = el("div", {
            class: "result-card" + (isError ? " result-card--error" : ""),
          });
          const header = el("div", { class: "result-card__bar" });
          const actions = el("div", {
            style: { display: "flex", alignItems: "center", gap: "8px" },
          });
          header.appendChild(
            el("div", { class: "result-card__meta" }, [
              el(
                "span",
                { class: "result-card__title" },
                isError ? "Error" : "Output",
              ),
              el(
                "span",
                { class: "badge " + (isError ? "ERROR" : "SUCCESS") },
                summary.kind,
              ),
              el("span", { class: "result-card__stats" }, summary.stats),
            ]),
          );

          header.appendChild(actions);
          const copyResult = async (event) => {
            if (event) event.stopPropagation();
            try {
              await navigator.clipboard.writeText(summary.raw);
              toast("Copied result to clipboard", "ok");
            } catch {
              toast("Copy failed", "err");
            }
          };

          const codeWrap = el("div", { class: "result-card__code-wrap" }, [
            el(
              "div",
              {
                class: "result-card__copy",
                title: "Copy result",
                "aria-label": "Copy result",
                role: "button",
                tabindex: "0",
                onclick: copyResult,
                onkeydown: (event) => {
                  if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    copyResult(event);
                  }
                },
              },
              [
                el("span", {
                  "aria-hidden": "true",
                  html: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy-icon lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>',
                }),
                el("span", { class: "sr-only" }, "Copy result"),
              ],
            ),
            el("pre", { class: "code result-card__code-body" }, summary.raw),
          ]);

          const codeBody = codeWrap.querySelector(".result-card__code-body");

          if (options.fullWidth) {
            const lineCount = summary.raw ? summary.raw.split("\n").length : 1;
            const collapsedHeight = Math.max(120, Math.min(300, lineCount * 18 + 24));
            codeBody.style.setProperty("--collapsed-max-height", collapsedHeight + "px");
            codeBody.setAttribute("data-collapsed-max-height", "true");

            const isLarge = lineCount > 10 || summary.raw.length > 1400;
            if (isLarge) {
              const toggle = el(
                "button",
                { class: "result-card__toggle", type: "button" },
                "Expand",
              );
              toggle.addEventListener("click", (event) => {
                event.stopPropagation();
                const expanded = card.classList.toggle("result-card--expanded");
                toggle.textContent = expanded ? "Collapse" : "Expand";
              });
              actions.appendChild(toggle);
            }
          }

          card.appendChild(header);
          card.appendChild(codeWrap);
          return card;
        }

        function doAction(name, path, method, okMsg) {

            .then(() => {
              toast(okMsg || name + " ok", "ok");
              render();
            })
            .catch((e) => toast(e.message, "err"));
        }

            } catch (e) {
              document.getElementById("info-body").innerHTML =
                `<div class="empty" style="color:var(--err)">${escapeHTML(e.message)}</div>`;
            }
          }
          await refresh();
          if (auto.checked) pollTimer = setInterval(refresh, POLL_MS);
        }

        // ---------------------------------------------------------------------
        // Boot
        // ---------------------------------------------------------------------
        function goto(path) {
          location.hash = "#" + path;
        }

        window.addEventListener("hashchange", render);
        auto.addEventListener("change", () => render());
        if (!location.hash) location.hash = "#/workflows";
        render();
      })();
    </script>
  </body>
</html>
